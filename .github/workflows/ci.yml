name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "27"
          distribution: "liberica"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Build with Gradle
        run: ./gradlew build
